<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tic-Tac-Toe · Game Cubby</title>
  <meta name="description" content="Classic tic-tac-toe for two players on one screen, with a running score across rounds.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script src="../../shared/js/theme-boot.js"></script>
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/game-shell.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar" data-reveal>
      <div class="title-group">
        <a class="icon-btn back-link" href="../../" aria-label="All games" title="All games">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
        </a>
        <h1 class="page-title">
          <svg class="title-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 4l6 6M10 4l-6 6"/><circle cx="17" cy="17" r="3.4"/>
          </svg>
          <span class="page-title-text">Tic-Tac-Toe</span>
        </h1>
      </div>
      <nav class="top-actions" aria-label="Game menu">
        <button class="icon-btn" id="btn-match" type="button" aria-label="New match">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg>
          <span class="btn-label">New match</span>
        </button>
        <button class="icon-btn" id="btn-theme" type="button" aria-label="Switch to dark theme">
          <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
            <g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g>
            <path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
          </svg>
        </button>
      </nav>
    </header>

    <main class="game">
      <section class="status" aria-label="Score" data-reveal>
        <div class="players">
          <div class="player player-x" data-player="X">
            <svg class="player-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            <span class="player-name">Player X</span>
            <span class="player-score" title="Rounds won"><span class="sr-only">Rounds won: </span><span data-score="X">0</span></span>
          </div>
          <div class="player player-o" data-player="O">
            <svg class="player-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/></svg>
            <span class="player-name">Player O</span>
            <span class="player-score" title="Rounds won"><span class="sr-only">Rounds won: </span><span data-score="O">0</span></span>
          </div>
        </div>
        <p class="hint" id="hint" aria-live="polite"></p>
        <p class="status-note" id="round-note"></p>
      </section>

      <div class="board-area">
        <svg id="board" class="board" role="group" aria-label="Board" aria-describedby="hint"></svg>
        <div class="confetti" aria-hidden="true"></div>
      </div>

      <section class="controls" aria-label="Round controls" data-reveal>
        <button type="button" class="btn" id="btn-undo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          <span>Undo</span>
        </button>
        <button type="button" class="btn primary" id="btn-round">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <span>New round</span>
        </button>
      </section>
    </main>
  </div>

  <dialog class="sheet" id="dlg-match" aria-labelledby="dlg-match-title">
    <form method="dialog">
      <h2 id="dlg-match-title">Start a new match?</h2>
      <div class="sheet-text">
        <p>Both scores go back to 0 and X starts round 1.</p>
      </div>
      <div class="sheet-actions">
        <button class="btn" value="cancel">Cancel</button>
        <button class="btn primary" value="start">New match</button>
      </div>
    </form>
  </dialog>
</body>
</html>
