name: Test and deploy to GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  deploy:
    # Only the repository's default branch is published.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: test
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level ones, so checkout
    # needs contents: read listed here again.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html favicon.svg css js vendor _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
